<style>
  :root{--black:#111315;--charcoal:#2a2d31;--gray-600:#494e54;--gray-400:#8a8f96;--gray-200:#e4e6e9;--gray-100:#f3f4f6;--white:#ffffff;--blue:#3d63ea;--blue-dark:#2745b8;--lime:#7ee62b;--lime-dark:#5cc00f;--maxw:1080px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:'Inter',sans-serif;color:var(--black);background:var(--white);line-height:1.5;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px;}
  .grid-bg{position:relative;}
  .grid-bg::before{content:"";position:absolute;inset:0;background-image:linear-gradient(to right, var(--gray-200) 1px, transparent 1px);background-size:290px 100%;opacity:.6;pointer-events:none;}
  header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--gray-200);}
  .header-inner{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;max-width:var(--maxw);margin:0 auto;}
  .logo-block{display:flex;flex-direction:column;line-height:1;}
  .logo-block .logo-main{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;letter-spacing:-0.5px;}
  .brand-lockup{flex-direction:row;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .brand-lockup .logo-main:last-child{color:var(--blue);}
  nav{display:flex;align-items:center;gap:36px;}
  nav .nav-links{display:flex;gap:28px;}
  nav .nav-links a{font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;color:var(--charcoal);transition:color .15s;}
  nav .nav-links a:hover{color:var(--blue);}
  .btn{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;letter-spacing:.5px;text-transform:uppercase;padding:14px 24px;border-radius:6px;border:none;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;}
  .btn:hover{transform:translateY(-1px);}
  .btn-lime{background:var(--lime);color:var(--black);box-shadow:0 2px 0 var(--lime-dark);}
  .btn-lime:hover{box-shadow:0 4px 0 var(--lime-dark);}
  .cta-short{display:none;}
  @media (max-width:480px){header .brand-lockup .logo-main{font-size:17px;}header .cta-full{display:none;}header .cta-short{display:inline;}header .btn{padding:11px 16px;font-size:11.5px;}}
  .hero{padding:72px 0 56px;border-bottom:1px solid var(--gray-200);}
  .eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:2px;color:var(--blue);text-transform:uppercase;margin-bottom:28px;}
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);}
  .hero h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(38px, 6vw, 68px);letter-spacing:-2px;line-height:0.98;margin-bottom:28px;}
  .hero h1 .accent{color:var(--blue);}
  .hero-lede{font-size:19px;color:var(--charcoal);max-width:600px;margin-bottom:28px;font-weight:400;}
  .tag-list{display:flex;flex-wrap:wrap;gap:12px 28px;margin-bottom:36px;}
  .tag-list span{display:flex;align-items:center;gap:9px;font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;color:var(--charcoal);}
  .tag-list .pip{width:8px;height:8px;border-radius:50%;background:var(--lime);flex:none;}
  .hero-ctas{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:28px;}
  .btn-lg{font-size:15px;padding:18px 30px;}
  .link-underline{font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;border-bottom:1.5px solid var(--gray-400);padding-bottom:3px;color:var(--charcoal);}
  .owner-badge{display:inline-flex;align-items:center;gap:10px;border:1.5px solid var(--lime);border-radius:6px;padding:10px 18px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;}
  .owner-badge .check{color:var(--lime-dark);font-weight:700;}
  .trust-strip{background:var(--black);color:#fff;padding:16px 0;}
  .trust-strip .wrap{display:flex;flex-wrap:wrap;gap:10px 40px;justify-content:center;align-items:center;}
  .trust-strip span{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:8px;}
  .trust-strip span::before{content:"";width:5px;height:5px;background:var(--lime);border-radius:50%;}
  .section{padding:76px 0;border-bottom:1px solid var(--gray-200);}
  .section-eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:14px;display:flex;align-items:center;gap:9px;}
  .section-eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--lime);}
  .section-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(26px,3.2vw,38px);letter-spacing:-1px;margin-bottom:18px;}
  .section-sub{color:var(--gray-600);max-width:600px;font-size:16px;margin-bottom:44px;}
  .fleet-card{border:1px solid var(--gray-200);border-radius:14px;overflow:hidden;}
  .fleet-head{padding:36px 40px 8px;}
  .fleet-head h3{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(24px,2.8vw,30px);letter-spacing:-1px;margin-bottom:14px;}
  .fleet-head p{color:var(--gray-600);font-size:15px;max-width:660px;margin-bottom:28px;}
  .vin-panel{border:1px solid var(--gray-200);border-radius:10px;padding:22px 26px;margin-bottom:36px;}
  .vin-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gray-400);margin-bottom:12px;}
  .vin-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .vin-number{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;letter-spacing:.5px;}
  .verified-badge{display:inline-flex;align-items:center;gap:6px;background:var(--lime);color:var(--black);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;padding:8px 14px;border-radius:5px;}
  .vin-bar{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--lime));}
  .spec-grid{display:grid;grid-template-columns:repeat(4,1fr);}
  .spec-cell{padding:22px 24px;border-top:1px solid var(--gray-200);border-right:1px solid var(--gray-200);}
  .spec-cell:nth-child(4n){border-right:none;}
  .spec-cell .label{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray-400);margin-bottom:10px;}
  .spec-cell .value{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;line-height:1.3;}
  .van-gallery{margin:0 40px 32px;}
  .van-gallery-main{border:1px solid var(--gray-200);border-radius:10px;overflow:hidden;margin-bottom:10px;background:#000;}
  .van-gallery-main img{width:100%;height:auto;max-height:460px;aspect-ratio:4/3;object-fit:cover;display:block;}
  .van-gallery-thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .van-gallery-thumb{border:1px solid var(--gray-200);border-radius:8px;overflow:hidden;cursor:pointer;background:#000;padding:0;margin:0;display:block;width:100%;font:inherit;}
  .van-gallery-thumb img{width:100%;height:150px;object-fit:cover;display:block;transition:opacity .15s;}
  .van-gallery-thumb:hover img{opacity:.85;}
  .van-gallery-thumb:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  .van-gallery-caption{padding:10px 2px 0;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gray-400);display:flex;justify-content:space-between;}
  .capacity-intro{padding:0 40px;margin-bottom:8px;}
  .capacity-intro h4{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:20px;}
  .capacity-grid{margin:0 40px 36px;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--gray-200);border:1px solid var(--gray-200);border-radius:10px;overflow:hidden;}
  .capacity-card{background:#fff;padding:24px 22px;}
  .capacity-card .label{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray-400);margin-bottom:10px;}
  .capacity-card .value{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:23px;letter-spacing:-.5px;margin-bottom:4px;}
  .capacity-card .note{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--gray-600);}
  .diagram-panel{margin:0 40px 36px;border:1px solid var(--gray-200);border-radius:10px;padding:26px;display:grid;grid-template-columns:1.1fr 0.9fr;gap:28px;align-items:center;}
  .diagram-panel svg{width:100%;height:auto;}
  .diagram-copy h5{font-family:'Space Grotesk',sans-serif;font-size:17px;margin-bottom:10px;}
  .diagram-copy p{color:var(--gray-600);font-size:14px;margin-bottom:8px;}
  .spec-disclaimer{margin:0 40px 36px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--gray-400);line-height:1.6;}
  .service-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--gray-200);border:1px solid var(--gray-200);border-radius:10px;overflow:hidden;}
  .service-card{background:#fff;padding:30px 24px;}
  .service-card .num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gray-400);margin-bottom:20px;}
  .service-card h3{font-family:'Space Grotesk',sans-serif;font-size:18px;margin-bottom:10px;letter-spacing:-.3px;}
  .service-card p{color:var(--gray-600);font-size:14px;}
  .about-grid{display:grid;grid-template-columns:0.85fr 1.15fr;gap:52px;align-items:center;}
  .about-photo{aspect-ratio:4/5;border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .about-photo .tagline{position:absolute;bottom:22px;left:22px;right:22px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;color:rgba(255,255,255,.9);text-transform:uppercase;text-shadow:0 1px 4px rgba(0,0,0,.8);}
  .about-copy p{color:var(--charcoal);font-size:16px;margin-bottom:18px;}
  .about-copy .name{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;margin-top:8px;}
  .about-copy .role{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:1.5px;color:var(--gray-600);text-transform:uppercase;}
  .contact-line{margin-top:22px;padding-top:20px;border-top:1px solid var(--gray-200);}
  .contact-line a, .contact-line span{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:13.5px;color:var(--charcoal);margin-right:26px;margin-bottom:8px;}
  .contact-line a:hover{color:var(--blue);}
  .quote-form{margin-top:8px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
  .form-field{display:flex;flex-direction:column;gap:6px;}
  .form-field-full{margin-bottom:24px;}
  .form-field label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gray-600);}
  .form-field input,.form-field textarea{font-family:'Inter',sans-serif;font-size:14.5px;padding:12px 14px;border:1px solid var(--gray-200);border-radius:6px;background:var(--gray-100);color:var(--black);width:100%;}
  .form-field input:focus,.form-field textarea:focus{outline:none;border-color:var(--blue);background:#fff;}
  .form-field textarea{resize:vertical;}
  .form-note{font-family:'JetBra
